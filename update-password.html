<!doctype html>
<html lang="fr-CA">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f96302">
  <meta name="robots" content="noindex,nofollow">
  <link rel="icon" href="/icons/icon-192.png">
  <link rel="apple-touch-icon" href="/icons/icon-192.png">
  <link rel="stylesheet" href="/styles.css">
  <link rel="stylesheet" href="/login-logo.css">
  <title>Nouveau mot de passe — Remplissage</title>
  <style>
    .password-page {
      min-height: 100dvh;
      display: grid;
      place-items: center;
      padding: 28px 16px;
      background: #f7f3f0;
    }
    .password-wrap {
      width: min(100%, 520px);
    }
    .password-brand {
      display: flex;
      align-items: center;
      gap: 14px;
      margin: 0 0 18px;
    }
    .password-brand h1,
    .password-brand p {
      margin: 0;
    }
    .password-card {
      padding: 28px;
      border: 1px solid #eadfd8;
      border-radius: 20px;
      background: #fff;
      box-shadow: 0 12px 35px rgba(45, 36, 31, .09);
    }
    .password-card h2 {
      margin: 0 0 8px;
    }
    .password-card form {
      display: grid;
      gap: 16px;
      margin-top: 22px;
    }
    .password-card label {
      display: grid;
      gap: 7px;
      font-weight: 750;
    }
    .password-card input {
      width: 100%;
    }
    .password-account {
      margin: 16px 0 0;
      padding: 12px 14px;
      border: 1px solid #f2d8c8;
      border-radius: 12px;
      background: #fff7f1;
      overflow-wrap: anywhere;
    }
    .password-message {
      margin-top: 16px;
    }
    .password-message.success {
      border-color: rgba(31, 125, 91, .35);
      background: rgba(31, 125, 91, .08);
    }
    .password-message.error {
      border-color: rgba(170, 45, 45, .3);
      background: rgba(170, 45, 45, .07);
    }
    .password-actions {
      display: grid;
      gap: 10px;
    }
    .password-back {
      text-align: center;
      color: #bf4b00;
      font-weight: 700;
      text-decoration: none;
    }
    @media (max-width: 520px) {
      .password-card { padding: 22px 18px; }
      .password-page { align-items: start; padding-top: 22px; }
    }
  </style>
</head>
<body>
  <main class="password-page">
    <div class="password-wrap">
      <div class="password-brand">
        <img class="brand-mark brand-logo" src="/icons/THD_logo_resized.jpg" alt="Logo Home Depot" width="58" height="58">
        <div>
          <p class="eyebrow">OUTIL DE MAGASIN</p>
          <h1>Remplissage</h1>
        </div>
      </div>

      <section class="password-card" aria-labelledby="passwordTitle">
        <p class="eyebrow">SÉCURITÉ DU COMPTE</p>
        <h2 id="passwordTitle">Choisir un nouveau mot de passe</h2>
        <p class="muted">Le lien reçu par courriel sera validé avant de permettre la modification.</p>

        <div id="passwordLoading" class="analysis-box" role="status">Validation du lien de récupération…</div>
        <div id="passwordMessage" class="analysis-box password-message" role="status" aria-live="polite" hidden></div>
        <p id="passwordAccount" class="password-account small" hidden></p>

        <form id="updatePasswordForm" hidden>
          <label>
            Nouveau mot de passe
            <input name="password" type="password" autocomplete="new-password" minlength="8" required placeholder="Au moins 8 caractères">
          </label>
          <label>
            Confirmer le nouveau mot de passe
            <input name="passwordConfirm" type="password" autocomplete="new-password" minlength="8" required>
          </label>
          <div class="password-actions">
            <button class="button primary wide" type="submit">Enregistrer le nouveau mot de passe</button>
            <a class="password-back" href="/">Retour à la connexion</a>
          </div>
        </form>

        <div id="invalidRecoveryActions" class="password-actions top-gap" hidden>
          <a class="button primary wide" href="/">Demander un nouveau lien</a>
        </div>
      </section>
    </div>
  </main>

  <script src="/update-password.js"></script>
</body>
</html>
